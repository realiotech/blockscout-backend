name: stage

on:
  push:
    branches:
      - stage
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: realiotech/workflows/.github/workflows/docker.yaml@main
    with:
      DEPLOY: false
      DOCKERFILE: docker/Dockerfile
      DOCKER_BUILD_CONTEXT: .
      ENVIRONMENT: stage
      IMAGE_NAME: blockscout-backend
      PUSH: true
      RUN_NUMBER: ${{ github.run_number }}
      SHA: ${{ github.sha }}
      BUILD_ARGS: |
        BLOCKSCOUT_VERSION=v11.2.6
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.DO_REGISTRY_PASSWORD_STAGE }}
